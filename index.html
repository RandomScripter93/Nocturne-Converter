const KEY_OPTIONS = [];
for(let i=0;i<12;i++) KEY_OPTIONS.push({name:NOTE_NAMES[i] + " major", tonic:i, mode:"major"});
for(let i=0;i<12;i++) KEY_OPTIONS.push({name:NOTE_NAMES[i] + " minor", tonic:i, mode:"minor"});

const $ = id => document.getElementById(id);
let loaded = null;
let lastOutput = "";
let detectedKey = null;

for(const key of KEY_OPTIONS){
  const option = document.createElement("option");
  option.value = JSON.stringify({tonic:key.tonic, mode:key.mode});
  option.textContent = key.name;
  $("key").appendChild(option);
}

function cleanText(v){
  return String(v ?? "").replace(/[|\r\n]+/g, " ").replace(/\s+/g, " ").trim();
}
function ascii(bytes){
  return String.fromCharCode(...bytes);
}
function readStr(view, pos, len){
  let s = "";
  for(let i=0;i<len;i++) s += String.fromCharCode(view.getUint8(pos+i));
  return s;
}
function readVar(view, ref, end){
  let value = 0;
  for(let i=0;i<4 && ref.pos<end;i++){
    const b = view.getUint8(ref.pos++);
    value = (value << 7) | (b & 0x7f);
    if((b & 0x80) === 0) break;
  }
  return value;
}
function noteName(n){
  return NOTE_NAMES[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1);
}
const LOW_CTRL_KEYS = ["1","2","3","4","5","6","7","8","9","0","q","w","e","r","t"];
const HIGH_CTRL_KEYS = ["y","u","i","o","p","a","s","d","f","g","h","j"];
const FULL_RANGE_MIN = 21;
const FULL_RANGE_MAX = 108;

function mapInfo(n){
  const m = KEY_MAP[n];
  if(m) return {key:m[0], shift:m[1] === 1, ctrl:false};
  if(n >= 21 && n <= 35) return {key:LOW_CTRL_KEYS[n - 21], shift:false, ctrl:true};
  if(n >= 97 && n <= 108) return {key:HIGH_CTRL_KEYS[n - 97], shift:false, ctrl:true};
  return null;
}
function keyName(n){
  const m = mapInfo(n);
  if(!m) return noteName(n);
  let prefix = "";
  if(m.ctrl) prefix += "ctrl+";
  if(m.shift) prefix += "shift+";
  return prefix + m.key;
}
function formatTime(ms){
  const sec = Math.max(0, Math.round(ms / 1000));
  return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2,"0");
}
function hash32(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h.toString(16).padStart(8,"0");

  const view = new DataView(buffer);
  const bytes = new Uint8Array(buffer);
  if(bytes.length < 14 || ascii(bytes.slice(0,4)) !== "MThd") throw new Error("Not a MIDI file.");

  const format = view.getUint16(pos); pos += 2;
  const trackCount = view.getUint16(pos); pos += 2;
  const divisionRaw = view.getUint16(pos); pos += 2;
  pos = 8 + headerLen;

  let ppqn = divisionRaw;
  let smpte = false;
  let fps = 0, ticksPerFrame = 0;

    smpte = true;
    fps = 256 - ((divisionRaw >> 8) & 0xff);
    ticksPerFrame = divisionRaw & 0xff;
    ppqn = fps * ticksPerFrame;
  }

  const notes = [];
  const pedal = [];
  const tempos = [{tick:0, us:500000}];
  let title = cleanText(filename.replace(/\.(mid|midi)$/i,""));

  for(let ti=0; ti<trackCount && pos < bytes.length; ti++){
    if(readStr(view,pos,4) !== "MTrk") throw new Error("Invalid MIDI track chunk.");
    pos += 4;
    const len = view.getUint32(pos); pos += 4;
    const end = Math.min(bytes.length, pos + len);

    let tick = 0;
    let running = 0;
    const active = Array.from({length:16}, () => Array.from({length:128}, () => []));

    while(pos < end){
      const ref = {pos};
      tick += readVar(view, ref, end);
      pos = ref.pos;
      if(pos >= end) break;

      let status = view.getUint8(pos++);
      if(status < 0x80){

        pos--;
        status = running;

        running = status;

        pos = r.pos;
        if(type === 0x51 && mlen === 3 && pos + 2 < end){
          const us = (view.getUint8(pos) << 16) | (view.getUint8(pos+1) << 8) | view.getUint8(pos+2);
          tempos.push({tick, us});
        }else if((type === 0x03 || type === 0x04) && mlen > 0 && !title){
          title = cleanText(readStr(view, pos, Math.min(mlen, end - pos)));
        }
        pos += mlen;
        if(type === 0x2f) break;
        continue;
      }

      if(status === 0xf0 || status === 0xf7){
        const r = {pos};
        const syxLen = readVar(view, r, end);
        pos = r.pos + syxLen;
        continue;
      }

      const eventType = status & 0xf0;
      const ch = status & 0x0f;
      const skipChannel = opts.skipDrums && ch === 9;

      if(eventType === 0x80 || eventType === 0x90){
        const note = view.getUint8(pos++);
        const vel = view.getUint8(pos++);
        if(skipChannel) continue;

        if(eventType === 0x90 && vel > 0){
          active[ch][note].push({tick, vel});
        }else{
          const start = active[ch][note].shift();
          if(start){
            notes.push({note, velocity:start.vel, startTick:start.tick, endTick:Math.max(tick, start.tick + 1), channel:ch});
          }
        }
      }else if(eventType === 0xb0){
        const cc = view.getUint8(pos++);
        const val = view.getUint8(pos++);
        if(cc === 64 && !skipChannel) pedal.push({tick, value:val});
      }else if(eventType === 0xc0 || eventType === 0xd0){
        pos += 1;
      }else if(eventType === 0xa0 || eventType === 0xe0){
        pos += 2;
      }else{
        throw new Error("Unsupported MIDI event: 0x" + status.toString(16));
      }
    }

    for(let ch=0; ch<16; ch++){
      if(opts.skipDrums && ch === 9) continue;
      for(let n=0; n<128; n++){
        for(const start of active[ch][n]){
          notes.push({note:n, velocity:start.vel, startTick:start.tick, endTick:start.tick + Math.max(1, Math.floor(ppqn / 4)), channel:ch});
        }
      }
    }

    pos = end;
  }

  const tickToMs = makeTickConverter(tempos, ppqn, smpte, fps, ticksPerFrame);
  return {format, ppqn, divisionRaw, smpte, tempos, notes, pedal, tickToMs, title: title || "Custom MIDI"};
}

function makeTickConverter(tempos, ppqn, smpte, fps, ticksPerFrame){
  if(smpte){
    const perSecond = Math.max(1, fps * ticksPerFrame);
    return tick => tick * 1000 / perSecond;
  }

  tempos = tempos
    .filter(t => Number.isFinite(t.tick) && Number.isFinite(t.us) && t.us > 0)
    .sort((a,b) => a.tick === b.tick ? 0 : a.tick - b.tick);

  const dedup = [];
  for(const t of tempos){
    if(dedup.length && dedup[dedup.length - 1].tick === t.tick) dedup[dedup.length - 1] = t;
    else dedup.push(t);
  }

  let segments = [{tick:0, ms:0, us:500000}];
  for(const t of dedup){
    const cur = segments[segments.length - 1];
    if(t.tick === cur.tick){
      cur.us = t.us;
    }else if(t.tick > cur.tick){
      const ms = cur.ms + ((t.tick - cur.tick) * cur.us / ppqn / 1000);
      segments.push({tick:t.tick, ms, us:t.us});
    }
  }

  return tick => {
    let lo = 0, hi = segments.length - 1;
    while(lo < hi){
      const mid = Math.ceil((lo + hi) / 2);
      if(segments[mid].tick <= tick) lo = mid; else hi = mid - 1;
    }
    const s = segments[lo];
    return s.ms + ((tick - s.tick) * s.us / ppqn / 1000);
  };
}

function rotateProfile(profile, tonic){
  const rotated = new Array(12);
  for(let i=0;i<12;i++) rotated[(i + tonic) % 12] = profile[i];
  return rotated;
}

function correlation(a, b){
  const meanA = a.reduce((sum, value) => sum + value, 0) / a.length;
  const meanB = b.reduce((sum, value) => sum + value, 0) / b.length;
  let numerator = 0, denomA = 0, denomB = 0;
  for(let i=0;i<a.length;i++){
    const da = a[i] - meanA;
    const db = b[i] - meanB;
    numerator += da * db;
    denomA += da * da;
    denomB += db * db;
  }
  if(denomA === 0 || denomB === 0) return -Infinity;
  return numerator / Math.sqrt(denomA * denomB);
}

function detectKey(notes){
  const histogram = new Array(12).fill(0);
  for(const note of notes){
    if(note.channel === 9) continue;
    const duration = Math.max(1, note.endTick - note.startTick);
    histogram[((note.note % 12) + 12) % 12] += duration * Math.max(1, note.velocity || 1);
  }
  if(histogram.every(value => value === 0)) return {tonic:0, mode:"major", score:0};

  let best = {tonic:0, mode:"major", score:-Infinity};
  for(let tonic=0;tonic<12;tonic++){
    const majorScore = correlation(histogram, rotateProfile(MAJOR_PROFILE, tonic));
    const minorScore = correlation(histogram, rotateProfile(MINOR_PROFILE, tonic));
    if(majorScore > best.score) best = {tonic, mode:"major", score:majorScore};
    if(minorScore > best.score) best = {tonic, mode:"minor", score:minorScore};
  }
  return best;
}

function shortestTranspose(fromTonic, toTonic){
  let diff = toTonic - fromTonic;
  while(diff > 6) diff -= 12;
  while(diff < -6) diff += 12;
  return diff;
}

function formatKey(key){
  return NOTE_NAMES[key.tonic] + " " + key.mode;
}

function selectKey(key){
  const wanted = JSON.stringify({tonic:key.tonic, mode:key.mode});
  const option = [...$("key").options].find(item => item.value === wanted);
  if(option) $("key").value = option.value;
}

function buildPhx(parsed, opts, filename){
  const transpose = Number(opts.transpose) || 0;
  const outNotes = [];
  let outsideRange = 0;

  for(const raw of parsed.notes){
    const n = raw.note + transpose;
    if(!mapInfo(n)) outsideRange++;
    const onset = Math.max(0, Math.round(parsed.tickToMs(raw.startTick)));
    const end = Math.max(onset + 1, Math.round(parsed.tickToMs(raw.endTick)));
    outNotes.push({
      note:n,
      key:keyName(n),
      onset,
      dur:Math.max(1, end - onset),
      velocity:Math.max(1, Math.min(127, raw.velocity || 80)),
      hand:n < 60 ? "L" : "R"
    });
  }

  outNotes.sort((a,b) => a.onset === b.onset ? a.note - b.note : a.onset - b.onset);

  let phrase = 0;
  let lastOnset = -99999;
  for(const n of outNotes){
    if(n.onset - lastOnset > 900) phrase++;
    n.phrase = phrase;
    lastOnset = n.onset;
  }

  const pedal = parsed.pedal
    .map(p => ({time:Math.max(0, Math.round(parsed.tickToMs(p.tick))), value:Math.max(0, Math.min(127, p.value || 0))}))
    .sort((a,b) => a.time - b.time);

  const duration = outNotes.reduce((m,n) => Math.max(m, n.onset + n.dur), 0);
  const firstTempo = parsed.tempos.find(t => t.us > 0) || {us:500000};
  const bpm = Math.round(60000000 / firstTempo.us);

  const title = cleanText(opts.name || parsed.title || filename.replace(/\.(mid|midi)$/i,"") || "Custom MIDI");
  const fp = hash32(title + "|" + outNotes.length + "|" + duration + "|" + transpose);

  const lines = [];
  lines.push("PHX3|Nocturne");
  lines.push([
    "META",
    "name=" + title,
    "bpm=" + bpm,
    "ppqn=" + parsed.ppqn,
    "notes=" + outNotes.length,
    "dur=" + duration,
    "timestamp=" + Math.max(1, Math.floor(Number(opts.timestamp) || Date.now() / 1000)),
    "preset=Custom MIDI",
    "fingerprint=" + fp
  ].join("|"));

  for(const n of outNotes){
    lines.push(["N", n.note, cleanText(n.key), n.onset, n.dur, n.velocity, n.hand, 1, "midi", n.phrase].join("|"));
  }
  for(const p of pedal) lines.push(["P", p.time, p.value].join("|"));
  lines.push("END");

  return {text:lines.join("\n"), noteIn:parsed.notes.length, noteOut:outNotes.length, outsideRange, transpose, duration, title};
}


function showView(name){
  document.querySelectorAll('.view').forEach(view => {
    view.classList.toggle('active', view.dataset.view === name);
  });
  document.querySelectorAll('.side-link').forEach(link => {
    link.classList.toggle('active', link.dataset.view === name);
  });
  const label = $('sectionLabel');
  const names = {upload:'Import', settings:'Settings', output:'Output'};
  if(label) label.textContent = names[name] || (name.charAt(0).toUpperCase() + name.slice(1));
}

async function loadFile(file){
  try{
    const buffer = await file.arrayBuffer();
    const parsed = parseMidi(buffer, file.name, {skipDrums:false});
    detectedKey = detectKey(parsed.notes);
    selectKey(detectedKey);
    loaded = {file, buffer, parsed, timestamp:Math.floor(Date.now() / 1000)};
    $('songName').value = file.name.replace(/\.(mid|midi)$/i,'');
    $('convert').disabled = false;
    setMsg('Loaded: ' + file.name + '\nDetected ' + formatKey(detectedKey) + '. Press Convert when ready.', 'good');
  }catch(err){
    loaded = null;
    detectedKey = null;
    $('convert').disabled = true;
    setMsg(err.message || 'Could not read MIDI.', 'bad');
  }
}

function newProject(){
  loaded = null;
  detectedKey = null;
  lastOutput = "";
  const file = $('file');
  if(file) file.value = "";
  $('songName').value = "";
  $('out').value = "";
  $('stIn').textContent = "0";
  $('stOut').textContent = "0";
  $('stTr').textContent = "0";
  $('stDur').textContent = "0:00";
  $('convert').disabled = true;
  $('copy').disabled = true;
  $('download').disabled = true;
  setMsg('No MIDI loaded yet.', '');
  showView('upload');
}

function convertNow(){
  if(!loaded){
    return;
  }
  try{
    const targetKey = JSON.parse($('key').value);
    const transpose = detectedKey ? shortestTranspose(detectedKey.tonic, targetKey.tonic) : 0;
    const opts = {
      skipDrums:false,
      transpose,
      timestamp:loaded.timestamp || Math.floor(Date.now() / 1000),
      name:$('songName').value
    };
    const parsed = loaded.parsed || parseMidi(loaded.buffer, loaded.file.name, opts);
    const result = buildPhx(parsed, opts, loaded.file.name);

    lastOutput = result.text;
    $('out').value = lastOutput;
    $('stIn').textContent = result.noteIn;
    $('stOut').textContent = result.noteOut;
    $('stTr').textContent = result.transpose > 0 ? '+' + result.transpose : String(result.transpose);
    $('stDur').textContent = formatTime(result.duration);
    $('copy').disabled = false;
    $('download').disabled = false;

    const outsideText = result.outsideRange ? ' ' + result.outsideRange + ' notes are outside the 88-key piano range and were preserved in the PHX file.' : '';
    const selectedKey = JSON.parse($('key').value);
    setMsg('Converted in ' + formatKey(selectedKey) + '. Kept ' + result.noteOut + ' notes.' + outsideText, 'good');
    showView('output');
  }catch(err){
    setMsg(err.message || 'Convert failed. The MIDI might be unsupported.', 'bad');
  }
}

function setMsg(text, type){
  const msg = $('msg');
  msg.textContent = text;
  msg.className = 'msg' + (type ? ' ' + type : '');
}

function downloadOutput(){
  if(!lastOutput){
    return;
  }
  const title = cleanText($('songName').value || 'custom_midi').replace(/[^\w\- ]+/g,'').replace(/\s+/g,'_') || 'custom_midi';
  const blob = new Blob([lastOutput], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = title + '.phx';
  document.body.appendChild(a);
  a.click();
  URL.revokeObjectURL(a.href);
  a.remove();
}

const dropEl = $('drop');
const fileEl = $('file');
dropEl.addEventListener('click', () => fileEl.click());
fileEl.addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if(f) loadFile(f);
});
dropEl.addEventListener('dragenter', e => {
  e.preventDefault();
  dropEl.classList.add('drag');
});
dropEl.addEventListener('dragover', e => {
  e.preventDefault();
  dropEl.classList.add('drag');
});
dropEl.addEventListener('dragleave', () => dropEl.classList.remove('drag'));
dropEl.addEventListener('drop', e => {
  e.preventDefault();
  dropEl.classList.remove('drag');
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if(f) loadFile(f);
});
$('convert').addEventListener('click', convertNow);
const newFileButton = $('newFile');
if(newFileButton) newFileButton.addEventListener('click', newProject);
$('download').addEventListener('click', downloadOutput);
$('copy').addEventListener('click', async () => {
  if(!lastOutput){
    return;
  }
  try{
    await navigator.clipboard.writeText(lastOutput);
    setMsg('Copied. Paste it into Nocturne Import.', 'good');
  }catch{
    $('out').focus();
    $('out').select();
    document.execCommand('copy');
    setMsg('Copied. Paste it into Nocturne Import.', 'good');
  }
});
